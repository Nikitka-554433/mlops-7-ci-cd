name: CI Pipeline

on:
  push:
    branches: [ "7-hw" ]
  pull_request:
    branches: [ "main" ]

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello! My name is ${{ secrets.MY_LOGIN }}. My password is ${{ secrets.MY_PASSWORD }}"
    env:
      MY_LOGIN: ${{ secrets.MY_LOGIN }}
      MY_PASSWORD: ${{ secrets.MY_PASSWORD }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - run: pip install flake8
      - run: flake8 .
        continue-on-error: true

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - run: |
          pip install -r requirements.txt
          pip install pytest
      - run: pytest tests/unit -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: success()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - run: |
          pip install -r requirements.txt
          pip install pytest
      - run: pytest tests/integration -v