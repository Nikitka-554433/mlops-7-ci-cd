name: Download from MinIO

on:
  push:
    branches: [ "download-image" ]
  pull_request:
    branches: [ "main" ]

jobs:
  download:
    runs-on: ubuntu-22.04
    steps:
      - name: Install mc client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl https://dl.min.io/client/mc/release/linux-amd64/mc --create-dirs -o $HOME/mc
          chmod +x $HOME/mc
          sudo mv $HOME/mc /usr/local/bin/mc
      
      - name: Debug secrets
        run: |
          echo "URL: ${{ secrets.MINIO_URL }}"
          echo "BUCKET: ${{ secrets.BUCKET_NAME }}"
          echo "Access key length: ${{ secrets.ACCESS_KEY }}"
          echo "Secret key length: ${{ secrets.SECRET_KEY }}"
          echo "File path: ${{ secrets.FILE_PATH }}"
          echo "Local path: ${{ secrets.LOCAL_PATH }}"
          echo "Hash: ${{ secrets.HASH_STRING }}"
      
      - name: Configure MinIO client
        run: |
          mc alias set minio "${{ secrets.MINIO_URL }}" "${{ secrets.ACCESS_KEY }}" "${{ secrets.SECRET_KEY }}"
      
            - name: Debug download paths
        run: |
          echo "Bucket: ${{ vars.BUCKET_NAME }}"
          echo "File path: ${{ vars.FILE_PATH }}"
          echo "Local path: ${{ vars.LOCAL_PATH }}"
      - name: Download file
        run: |
          mkdir -p /tmp
          mc cp minio/${{ vars.BUCKET_NAME }}/${{ vars.FILE_PATH }} ${{ vars.LOCAL_PATH }}
      
      - name: Verify MD5
        run: |
          echo "${{ secrets.HASH_STRING }} ${{ secrets.LOCAL_PATH }}" | md5sum -c -